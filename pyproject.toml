[project]
name = "healthcare-agentic-system"
version = "0.1.0"
description = "healthcare support agent for all types of user queries"
requires-python = ">3.10, <3.15"
dependencies = [
    "psycopg>=3.3.6",
    "psycopg-binary>=3.3.6",
    "psycopg-pool>=3.3.2",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
